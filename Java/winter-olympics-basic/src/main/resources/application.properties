spring.application.name=winter-olympics-basic
server.port=8090

spring.datasource.url=jdbc:mysql://localhost/winter_olympics?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=education_user
spring.datasource.password=education_user
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework=INFO

spring.thymeleaf.cache=false

app.slalom.qualifiers-for-run-two=30
app.biathlon.penalty-seconds-per-miss=60
