<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Create competition')}"></head>
<body>
<nav th:replace="~{fragments :: header}"></nav>
<div class="container">
    <h2>Create competition</h2>
    <form th:action="@{/admin/competitions/create}" th:object="${competition}" method="post">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" th:field="*{name}"/>
            <small class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Type</label>
                <select class="form-select" th:field="*{type}">
                    <option th:each="t : ${T(com.inf.cscb869_olympics.data.entity.CompetitionType).values()}"
                            th:value="${t}" th:text="${t}"></option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Gender</label>
                <select class="form-select" th:field="*{gender}">
                    <option th:each="g : ${T(com.inf.cscb869_olympics.data.entity.Gender).values()}"
                            th:value="${g}" th:text="${g}"></option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Minimum age</label>
                <input type="number" class="form-control" th:field="*{minAge}"/>
                <small class="text-danger" th:if="${#fields.hasErrors('minAge')}" th:errors="*{minAge}"></small>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Held on</label>
            <input type="date" class="form-control" th:field="*{heldOn}"/>
            <small class="text-danger" th:if="${#fields.hasErrors('heldOn')}" th:errors="*{heldOn}"></small>
        </div>
        <button class="btn btn-primary" type="submit">Create</button>
        <a class="btn btn-link" th:href="@{/competitions}">Cancel</a>
    </form>
</div>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
