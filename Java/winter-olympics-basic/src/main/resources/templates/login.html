<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Login')}"></head>
<body>
<nav th:replace="~{fragments :: header}"></nav>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h2>Sign in</h2>
            <div th:if="${param.error}" class="alert alert-danger">Invalid username or password.</div>
            <div th:if="${param.registered}" class="alert alert-success">Account created — please sign in.</div>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required/>
                </div>
                <button class="btn btn-primary" type="submit">Sign in</button>
                <a class="btn btn-link" th:href="@{/register}">Register as athlete</a>
            </form>
        </div>
    </div>
</div>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
