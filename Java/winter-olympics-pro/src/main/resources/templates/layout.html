<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#0b1228"/>
    <title th:text="${title}">Winter Olympics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<!-- Animated snowfall background -->
<div th:fragment="snow" class="snow" aria-hidden="true">
    <span style="left:4%;  font-size:14px; animation-duration:14s; animation-delay:0s;">❄</span>
    <span style="left:11%; font-size:10px; animation-duration:18s; animation-delay:2s;">❅</span>
    <span style="left:18%; font-size:16px; animation-duration:11s; animation-delay:4s;">❄</span>
    <span style="left:25%; font-size:12px; animation-duration:16s; animation-delay:1s;">❆</span>
    <span style="left:32%; font-size:9px;  animation-duration:20s; animation-delay:6s;">❅</span>
    <span style="left:39%; font-size:14px; animation-duration:13s; animation-delay:3s;">❄</span>
    <span style="left:46%; font-size:11px; animation-duration:17s; animation-delay:7s;">❆</span>
    <span style="left:53%; font-size:13px; animation-duration:12s; animation-delay:0s;">❅</span>
    <span style="left:60%; font-size:15px; animation-duration:15s; animation-delay:5s;">❄</span>
    <span style="left:67%; font-size:10px; animation-duration:19s; animation-delay:2s;">❆</span>
    <span style="left:74%; font-size:13px; animation-duration:14s; animation-delay:8s;">❅</span>
    <span style="left:81%; font-size:12px; animation-duration:16s; animation-delay:4s;">❄</span>
    <span style="left:88%; font-size:15px; animation-duration:13s; animation-delay:1s;">❆</span>
    <span style="left:95%; font-size:10px; animation-duration:18s; animation-delay:6s;">❅</span>
</div>

<nav th:fragment="header" class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <span class="flake" aria-hidden="true">❄</span>
            <span>Winter Olympics</span>
        </a>
        <div class="navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/competitions}">Competitions</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/medals}">Medals</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/stats}">Stats</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/swagger-ui.html}" target="_blank">API docs</a></li>
            </ul>
            <ul class="navbar-nav align-items-center">
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-primary btn-sm" th:href="@{/login}">Sign in</a>
                </li>
                <li class="nav-item me-2" sec:authorize="isAuthenticated()">
                    <span class="navbar-text" sec:authentication="name">user</span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="footer">
    <footer>
        <small>Winter Olympics · CSCB869</small>
    </footer>
    <script>
        (function () {
            var path = window.location.pathname;
            document.querySelectorAll('.navbar .nav-link').forEach(function (link) {
                var href = link.getAttribute('href') || '';
                if (href === '/' || href === '') return;
                if (path === href || path.indexOf(href + '/') === 0) {
                    link.classList.add('active');
                }
            });
        })();
    </script>
</div>
</body>
</html>
