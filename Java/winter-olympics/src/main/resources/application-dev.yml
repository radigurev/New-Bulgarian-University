spring:
  datasource:
    url: jdbc:h2:mem:olympics_dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2
  jpa:
    hibernate:
      ddl-auto: validate
  thymeleaf:
    cache: false

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    com.inf.olympics: DEBUG
