<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Not found')}"></head>
<body>
<div th:replace="~{layout :: snow}"></div>
<nav th:replace="~{layout :: header}"></nav>
<main class="container">
    <div class="auth-card">
        <h2 class="mb-2" th:text="${errorTitle} ?: 'Not found'">Not found</h2>
        <p class="text-muted mb-4" th:text="${errorMessage} ?: 'The page you requested could not be found.'">The page you requested could not be found.</p>
        <a class="btn btn-info" th:href="@{/}">← Home</a>
    </div>
</main>
<div th:replace="~{layout :: footer}"></div>
</body>
</html>
