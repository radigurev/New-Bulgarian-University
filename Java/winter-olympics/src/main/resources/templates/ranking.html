<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Ranking')}"></head>
<body>
<div th:replace="~{layout :: snow}"></div>
<nav th:replace="~{layout :: header}"></nav>
<main class="container">
    <section class="page-header">
        <h1 th:text="${competition.name}">Competition</h1>
        <p class="lead">
            <span th:text="${competition.type}">TYPE</span> ·
            <span th:text="${competition.gender}">GENDER</span> ·
            <span th:text="${competition.heldOn}">date</span>
        </p>
    </section>

    <section class="table-wrap">
        <table class="table mb-0">
            <thead>
            <tr>
                <th>#</th>
                <th>Athlete</th>
                <th>Country</th>
                <th>Total time (s)</th>
                <th>Medal</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${ranking}">
                <td>
                    <span class="rank-pill"
                          th:classappend="${r.position == 1} ? 'rank-1' : (${r.position == 2} ? 'rank-2' : (${r.position == 3} ? 'rank-3' : ''))"
                          th:text="${r.position}">—</span>
                </td>
                <td th:text="${r.firstName + ' ' + r.lastName}">—</td>
                <td th:text="${r.country}">—</td>
                <td><code th:text="${r.totalTimeSeconds}">—</code></td>
                <td>
                    <span th:if="${r.medal != null and r.medal.name() == 'GOLD'}" class="badge bg-warning">Gold</span>
                    <span th:if="${r.medal != null and r.medal.name() == 'SILVER'}" class="badge medal-silver">Silver</span>
                    <span th:if="${r.medal != null and r.medal.name() == 'BRONZE'}" class="badge bg-danger">Bronze</span>
                </td>
            </tr>
            <tr th:if="${ranking.isEmpty()}">
                <td colspan="5" class="text-center text-muted py-5">No classified results yet.</td>
            </tr>
            </tbody>
        </table>
    </section>

    <div class="mt-3">
        <a class="btn btn-secondary btn-sm" th:href="@{/competitions}">← Competitions</a>
    </div>
</main>
<div th:replace="~{layout :: footer}"></div>
</body>
</html>
