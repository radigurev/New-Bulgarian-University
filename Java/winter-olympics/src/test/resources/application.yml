spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:mem:olympics_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  liquibase:
    enabled: false

app:
  security:
    jwt:
      issuer: winter-olympics-test
      ttl-minutes: 30
      secret: test-test-test-test-test-test-test-test-test-test-test-test-1234
